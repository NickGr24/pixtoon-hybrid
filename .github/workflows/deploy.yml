name: Deploy demo to GitHub Pages

# Демо-сборка раздела Hybrid Production.
# PATH_PREFIX нужен потому, что Pages отдаёт сайт из подпапки /<repo>/,
# а ссылки в шаблонах корневые. Для боевой сборки под MODX переменная не
# задаётся — тогда пути остаются как есть.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен последний, а не все подряд
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
